name: Update README stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_readme.py", ".github/workflows/readme.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # README_TOKEN (a personal access token) is only needed to include private work
      - run: python3 scripts/update_readme.py README.md
        env:
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ vars.INCLUDE_PRIVATE || 'false' }}

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update README stats"
          git push

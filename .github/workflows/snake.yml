name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3a7bd5&color_dots=#ebedf0,#b8d4f5,#7aa7ff,#3a7bd5,#1f4f99
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5cc8ff&color_dots=#161b22,#0e2a47,#1b4f8c,#2f7fd5,#2dd4bf

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b04808&color_dots=#eef2f6,#c9d6e3,#93abc4,#56789b,#0e1b2b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7a1a&color_dots=#141f2c,#1f3550,#33577d,#5b85b0,#a9c6e4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

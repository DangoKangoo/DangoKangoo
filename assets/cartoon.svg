<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb3d9"/>
      <stop offset="0.6" stop-color="#e9d9a6"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb0bf"/>
      <stop offset="1" stop-color="#3c5468"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6d5" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff9a1f"/>
      <stop offset="0.25" stop-color="#ff2f86"/>
      <stop offset="0.5" stop-color="#8a2be2"/>
      <stop offset="0.75" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#1fd1b5"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="lensClip">
      <path d="M138,206 Q200,196 266,203 L262,232 Q240,242 214,233 L200,222 L186,233 Q160,242 141,233 Z"/>
    </clipPath>
    <clipPath id="frame">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <style>
    .cloud { animation: drift 24s linear infinite; }
    .cloud.slow { animation-duration: 36s; }
    .wave { animation: wave 6s ease-in-out infinite alternate; }
    .wave.b { animation-duration: 8s; animation-direction: alternate-reverse; }
    .glint { animation: twinkle 2.4s ease-in-out infinite; }
    .glint:nth-of-type(2n) { animation-delay: -0.8s; }
    .glint:nth-of-type(3n) { animation-delay: -1.6s; }
    .sun { animation: pulse 5s ease-in-out infinite; transform-origin: 335px 156px; }
    .me { animation: bob 4s ease-in-out infinite; }
    @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(440px); } }
    @keyframes wave { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>

  <g clip-path="url(#frame)">
    <!-- Sky + sun -->
    <rect width="400" height="175" fill="url(#sky)"/>
    <circle class="sun" cx="335" cy="156" r="46" fill="url(#sunGlow)"/>
    <circle cx="335" cy="156" r="16" fill="#fff4cf"/>

    <!-- Clouds -->
    <g class="cloud" fill="#fdf6e3" opacity="0.9">
      <ellipse cx="60" cy="60" rx="38" ry="12"/>
      <ellipse cx="85" cy="52" rx="24" ry="12"/>
      <ellipse cx="40" cy="55" rx="18" ry="9"/>
    </g>
    <g class="cloud slow" fill="#f4ead2" opacity="0.8" style="animation-delay:-14s">
      <ellipse cx="60" cy="110" rx="46" ry="10"/>
      <ellipse cx="90" cy="103" rx="26" ry="10"/>
    </g>
    <g class="cloud" fill="#fdf6e3" opacity="0.7" style="animation-delay:-8s">
      <ellipse cx="60" cy="140" rx="30" ry="7"/>
    </g>

    <!-- Sea -->
    <rect y="172" width="400" height="228" fill="url(#sea)"/>
    <g stroke="#dfe8ef" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
      <path class="wave" d="M-20,200 q15,-5 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0"/>
      <path class="wave b" d="M-20,232 q18,-6 36,0 t36,0 t36,0 t36,0 t36,0"/>
      <path class="wave" d="M-20,268 q20,-6 40,0 t40,0 t40,0 t40,0"/>
      <path class="wave b" d="M-20,308 q22,-7 44,0 t44,0 t44,0"/>
    </g>
    <!-- Sun path on the water -->
    <g fill="#fff6d5">
      <rect class="glint" x="280" y="182" width="26" height="2.5" rx="1"/>
      <rect class="glint" x="262" y="190" width="18" height="2.5" rx="1"/>
      <rect class="glint" x="300" y="194" width="20" height="2.5" rx="1"/>
      <rect class="glint" x="250" y="202" width="14" height="2.5" rx="1"/>
      <rect class="glint" x="40" y="246" width="16" height="2.5" rx="1"/>
      <rect class="glint" x="70" y="284" width="20" height="2.5" rx="1"/>
      <rect class="glint" x="25" y="322" width="14" height="2.5" rx="1"/>
    </g>

    <!-- Island on the horizon -->
    <path d="M205,178 C230,170 255,164 300,161 C330,159 370,158 400,160 L400,180 L205,180 Z" fill="#3d4430"/>
    <rect x="318" y="152" width="5" height="8" fill="#3d4430"/>

    <!-- Grassy cliff -->
    <path d="M400,195 C350,205 315,245 300,290 C290,330 285,370 280,400 L400,400 Z" fill="#6f6b3a"/>
    <path d="M400,230 C365,240 335,275 322,320 L318,400 L400,400 Z" fill="#5c5a30"/>
    <g fill="#9a4b2e" opacity="0.7">
      <ellipse cx="350" cy="300" rx="10" ry="4"/>
      <ellipse cx="375" cy="350" rx="12" ry="4"/>
    </g>
    <ellipse cx="365" cy="255" rx="14" ry="8" fill="#a3a49a"/>

    <!-- Me -->
    <g class="me">
      <!-- Jacket -->
      <path d="M50,400 C60,330 115,298 200,293 C285,298 340,330 350,400 Z" fill="#1f2a44"/>
      <path d="M118,330 C125,300 160,282 200,282 C240,282 275,300 282,330 C262,318 235,312 200,312 C165,312 138,318 118,330 Z" fill="#162036"/>
      <path d="M230,330 L236,400" stroke="#2c3a5c" stroke-width="3"/>

      <!-- Face -->
      <ellipse cx="200" cy="218" rx="62" ry="76" fill="#e8b597"/>

      <!-- Beanie -->
      <path d="M135,222 C128,150 165,126 200,126 C238,126 274,150 266,222 C250,198 150,198 135,222 Z" fill="#9aa0a6"/>
      <path d="M152,150 C170,136 190,132 205,133" stroke="#c2c7cc" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M200,128 L200,170" stroke="#868c92" stroke-width="2"/>

      <!-- Beard -->
      <path d="M138,232 C134,275 150,325 200,340 C250,325 266,275 262,232 C252,252 236,262 222,264 Q200,258 178,264 C164,262 148,252 138,232 Z" fill="#7a4a2e"/>
      <g stroke="#a3836b" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
        <path d="M185,305 q2,10 0,20"/>
        <path d="M200,308 q1,12 0,24"/>
        <path d="M215,305 q-2,10 0,20"/>
      </g>
      <g stroke="#5e3721" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M155,275 q4,14 12,24"/>
        <path d="M245,275 q-4,14 -12,24"/>
      </g>

      <!-- Nose -->
      <path d="M191,232 Q187,252 195,257 Q200,259 205,257 Q213,252 209,232 Z" fill="#dda083"/>

      <!-- Moustache + pursed "ooh" mouth -->
      <path d="M174,265 Q200,252 226,265 Q214,271 200,268 Q186,271 174,265 Z" fill="#673b22"/>
      <ellipse cx="200" cy="279" rx="9" ry="7.5" fill="#d48a84"/>
      <ellipse cx="200" cy="280" rx="4" ry="3.5" fill="#5a2b2b"/>

      <!-- Sunglasses -->
      <path d="M138,206 Q200,196 266,203 L262,232 Q240,242 214,233 L200,222 L186,233 Q160,242 141,233 Z" fill="url(#lens)"/>
      <g clip-path="url(#lensClip)">
        <rect x="-60" y="180" width="18" height="80" fill="#ffffff" opacity="0.45" transform="skewX(-25)">
          <animate attributeName="x" values="-60;-60;420" keyTimes="0;0.6;1" dur="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <path d="M134,207 Q200,195 270,202" stroke="#1b1b1f" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
